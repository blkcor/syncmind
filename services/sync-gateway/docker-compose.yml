services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncmind
    ports:
      - "5432:5432"
    volumes:
      - spine_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  spine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:latest}
    ports:
      - "8080:8080"
    volumes:
      - ./spine.yaml:/root/spine.yaml:ro
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/syncmind?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  spine_pg_data:
